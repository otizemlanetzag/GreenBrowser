<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>New Tab • Green Browser</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #080f0a; /* Deep forest black for OLED battery saving */
            color: #d8f3dc;
            font-family: "Segoe UI", "Ubuntu", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .logo {
            font-size: 2.4rem;
            font-weight: bold;
            color: #52b788;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #95d5b2;
            font-size: 0.95rem;
            margin-bottom: 32px;
        }
        .search-box {
            width: 100%;
            max-width: 580px;
            display: flex;
            background-color: #132418;
            border: 1px solid #2d6a4f;
            border-radius: 28px;
            padding: 6px 14px;
            margin-bottom: 32px;
        }
        .search-box:focus-within {
            border-color: #52b788;
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #e8f5e9;
            font-size: 1.05rem;
            padding: 10px 14px;
            outline: none;
        }
        .search-box button {
            background-color: #2d6a4f;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 10px 22px;
            font-weight: bold;
            cursor: pointer;
        }
        .search-box button:hover {
            background-color: #40916c;
        }

        /* Shortcuts Area */
        .shortcuts-container {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 650px;
            margin-bottom: 40px;
        }
        .shortcut-card {
            position: relative;
            background-color: #132418;
            border: 1px solid #1b4332;
            border-radius: 10px;
            padding: 12px 20px;
            text-decoration: none;
            color: #d8f3dc;
            font-size: 0.92rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 110px;
            transition: background 0.2s, border-color 0.2s;
        }
        .shortcut-card:hover {
            background-color: #1b4332;
            border-color: #52b788;
        }
        .trust-tag {
            color: #52b788;
            font-size: 0.72rem;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .remove-btn {
            position: absolute;
            top: 4px;
            right: 6px;
            background: none;
            border: none;
            color: #74c69d;
            font-size: 0.85rem;
            cursor: pointer;
            display: none;
        }
        .shortcut-card:hover .remove-btn {
            display: block;
        }
        .remove-btn:hover {
            color: #ff6b6b;
        }
        .add-shortcut-btn {
            background-color: #0b140e;
            border: 1px dashed #2d6a4f;
            border-radius: 10px;
            padding: 12px 20px;
            color: #74c69d;
            font-size: 0.92rem;
            cursor: pointer;
            min-width: 130px;
        }
        .add-shortcut-btn:hover {
            background-color: #132418;
            border-color: #52b788;
            color: #ffffff;
        }

        /* Inline Add Form (Hidden by default) */
        .add-form {
            display: none;
            gap: 8px;
            background-color: #132418;
            border: 1px solid #2d6a4f;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .add-form input {
            background-color: #080f0a;
            border: 1px solid #2d6a4f;
            color: #e8f5e9;
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
        }
        .add-form button {
            background-color: #2d6a4f;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
        }
        .add-form button.cancel {
            background-color: #3d1c1c;
        }

        .eco-stats {
            background-color: #0b140e;
            border: 1px dashed #2d6a4f;
            border-radius: 12px;
            padding: 14px 24px;
            text-align: center;
            color: #95d5b2;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="logo">🌿 Green Browser</div>
    <div class="subtitle">Eco-Friendly Browsing • Battery Guard Active • AGPL-3.0</div>

    <!-- Ecosia Search Form with /search/?q= -->
    <form class="search-box" action="https://www.ecosia.org/search?method=index&" method="GET">
        <input type="text" name="?q" placeholder="Search with Ecosia to plant trees..." autofocus required>
        <button type="submit">Search 🌱</button>
    </form>

    <!-- Dynamic Shortcuts Grid (Starts empty with only the Add button) -->
    <div class="shortcuts-container" id="shortcutsGrid">
        <button class="add-shortcut-btn" id="openAddBtn">+ Add Shortcut</button>
    </div>

    <!-- Add Shortcut Form -->
    <div class="add-form" id="addForm">
        <input type="text" id="scName" placeholder="Name (e.g. My Tool)" required>
        <input type="text" id="scUrl" placeholder="URL (e.g. mytool.trust or https://...)" required>
        <button type="button" id="saveScBtn">Save</button>
        <button type="button" class="cancel" id="cancelScBtn">Cancel</button>
    </div>

    <div class="eco-stats">
        🔋 <b>Battery Guard:</b> Tabs exceeding your energy threshold are automatically frozen.
    </div>

    <script>
        const STORAGE_KEY = "green_browser_shortcuts";
        const grid = document.getElementById("shortcutsGrid");
        const openAddBtn = document.getElementById("openAddBtn");
        const addForm = document.getElementById("addForm");
        const scNameInput = document.getElementById("scName");
        const scUrlInput = document.getElementById("scUrl");

        function loadShortcuts() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        }

        function saveShortcuts(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function formatUrl(raw) {
            let url = raw.trim();
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = url.endsWith(".trust") ? "http://" + url : "https://" + url;
            }
            return url;
        }

        function renderShortcuts() {
            document.querySelectorAll(".shortcut-card").forEach(el => el.remove());

            const shortcuts = loadShortcuts();
            shortcuts.forEach((item, index) => {
                const card = document.createElement("a");
                card.className = "shortcut-card";
                card.href = item.url;

                const isTrust = item.url.replace(/^https?:\/\//, "").split("/")[0].endsWith(".trust");
                if (isTrust) {
                    const badge = document.createElement("span");
                    badge.className = "trust-tag";
                    badge.textContent = "🛡️ .TRUST";
                    card.appendChild(badge);
                }

                const label = document.createElement("span");
                label.textContent = item.name;
                card.appendChild(label);

                const removeBtn = document.createElement("button");
                removeBtn.className = "remove-btn";
                removeBtn.textContent = "×";
                removeBtn.title = "Remove shortcut";
                removeBtn.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const updated = loadShortcuts();
                    updated.splice(index, 1);
                    saveShortcuts(updated);
                    renderShortcuts();
                };
                card.appendChild(removeBtn);

                grid.insertBefore(card, openAddBtn);
            });
        }

        openAddBtn.onclick = () => {
            addForm.style.display = "flex";
            scNameInput.focus();
        };

        document.getElementById("cancelScBtn").onclick = () => {
            addForm.style.display = "none";
            scNameInput.value = "";
            scUrlInput.value = "";
        };

        document.getElementById("saveScBtn").onclick = () => {
            const name = scNameInput.value.trim();
            const rawUrl = scUrlInput.value.trim();
            if (!name || !rawUrl) return;

            const shortcuts = loadShortcuts();
            shortcuts.push({ name: name, url: formatUrl(rawUrl) });
            saveShortcuts(shortcuts);

            scNameInput.value = "";
            scUrlInput.value = "";
            addForm.style.display = "none";
            renderShortcuts();
        };

        renderShortcuts();
    </script>

</body>
</html>
